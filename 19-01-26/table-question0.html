<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;

        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table border="1" width="100%">
        <tr>
            <th colspan="4">Company Report</th>
        </tr>
        <tr>
            <th rowspan="2">Department</th>
            <th rowspan="2">Employee Name</th>
            <th colspan="2">Details</th>
        </tr>
        <tr>
            <th>Age</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>IT</td>
            <td>Rahul</td>
            <td>25</td>
            <td>50000</td>
        </tr>
        <tr>
            <td>HR</td>
            <td colspan="3">Neha – 45000</td>
        </tr>
    </table>
    
    
    
     
</body>
</html>
