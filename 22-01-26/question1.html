<!DOCTYPE html>
<html>
<head>
<style>
  * {
    box-sizing: border-box;
  }
  
  body {
    font-family: Arial, sans-serif;
    color: #333;
    background-color: #f0f0f0;
  }
  
  .card {
    background-color: white;
    border: 1px solid #ddd;
    padding: 20px;
    margin: 15px;
    display: inline-block;
    width: 250px;
  }
  
  .card h2 {
    color: darkblue;
    margin-top: 0;
    text-align: center;
  }
  
  .card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
  }
  
  .card .price {
    color: green;
    font-weight: bold;
    font-size: 20px;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="card">
    <h2>Product 1</h2>
    <p>This is a great product. It has excellent quality and amazing features.</p>
    <div class="price">$99</div>
  </div>
  
  <div class="card">
    <h2>Product 2</h2>
    <p>Another fantastic option. Worth every penny for the value it provides.</p>
    <div class="price">$149</div>
  </div>
  
  <div class="card">
    <h2>Product 3</h2>
    <p>Premium quality with superior performance and durability guaranteed.</p>
    <div class="price">$199</div>
  </div>
</body>
</html>
