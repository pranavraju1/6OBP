<!-- make a yellow circle and a red circle the  -->
<!-- yellow circle is bigger than the red circle -->
<!-- red circle is at the center the yellow circle -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .yellow_circle{
            height: 500px;
            width: 500px;
            background-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }
        .red_circle{
            height: 300px;
            width: 300px;
            background-color: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="yellow_circle">
        <div class="red_circle"></div>
    </div>
</body>
</html>
