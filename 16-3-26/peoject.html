<!-- we are making an recipe cook book where users can store there recipes -->
<!-- which indludes details like name, ingredients, time etc  -->
<!-- this is then stored in the localstorage -->
<!-- users can either choose to cook the item, delete the item and add to favourites -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .error{
            color: red;
        }
    </style>

</head>
<body class="bg-gray-900 text-white p-6 max-w-4xl mx-auto">
    <!-- Header -->
    <h1 class="text-3xl font-bold mb-6 flex items-center gap-3">
        Recipe Roulette <span class="text-2xl">🎲</span>
    </h1>

    <div class="grid md:grid-cols-2 gap-6">
        <!-- Form -->
         <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl mb-4 font-semibold">Add Recipe</h2>
            <form id="recipeForm">
                <div class="mb-4">
                    <label for="">Name:</label>
                    <input id="name" class="w-full p-2 bg-gray-700 rounded mt-1" required minlength="3">
                    <span id="nameError" class="error text-sm"></span>
                </div>

                 <div class="mb-4">
                    <label for="">Ingredients:</label>
                    <textarea id="ingredients" class="w-full p-2 bg-gray-700 rounded mt-1" required></textarea>
                    <span id="ingError" class="error text-sm"></span>
                </div>

                <div class="mb-4">
                    <label for="">Time (min):</label>
                    <input type="number" id="time" min="5" class="w-full p-2 bg-gray-700 rounded mt-1" required>
                    <span id="timeError" class="error text-sm"></span>
                </div>

                <div class="mb-4">
                    <label for="">Difficulty:</label>
                    <br>
                    <label>
                        <input type="radio" name="diff" value="Easy" required>
                        Easy
                    </label>
                    <label class="ml-4">
                        <input type="radio" name="diff" value="Medium" required>
                        Medium
                    </label>
                    <label class="ml-4">
                        <input type="radio" name="diff" value="Hard" required>
                        Hard
                    </label>

                    <span id="diffError" class="error text-sm"></span>
                </div>


                <div class="mb-4">
                    <label for="">Category:</label>
                    <br>
                    <label>
                        <input type="checkbox" name="cat" value="Breakfast">
                        Breakfast
                    </label>
                    <label class="ml-4">
                        <input type="checkbox" name="cat" value="Lunch">
                        Lunch
                    </label>
                    <label class="ml-4">
                        <input type="checkbox" name="cat" value="Dinner">
                        Dinner
                    </label>
                     <label class="ml-4">
                        <input type="checkbox" name="cat" value="Snack">
                        Snack
                    </label>

                    <span id="catError" class="error text-sm"></span>
                </div>

                <button id="addBtn" type="submit" disabled class="w-full bg-green-500 hover:bg-green-600 p-2 rounded font-semibold">
                    Add Recipe
                </button>
            </form>
         </div>

         <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">All Recipe (<span id="count">0</span>)</h2>
                <button id="spinBtn" disabled class="bg-orange-500  hover:bg-orange-600 px-4 py-2 rounded font-semibold">Spin Wheel ☸️</button>
            </div>

            <div id="recipes" class="space-y-3 mb-6">
                <!-- Recipes appear here -->
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" >
                <div class="bg-gray-800 p-4 rounded-lg">
                    <h3 class="font-semibold mb-2">Favorites ⭐</h3>
                    <div id="favorites">
                        <!-- favorites will be shown here -->
                    </div>
                </div>

                <div class="bg-gray-800 p-4 rounded-lg">
                    <h3 class="font-semibold mb-2">Recently Cooked</h3>
                    <div id="recent">
                        <!-- recent cooks will be shown here -->
                    </div>
                </div>
            </div>

            <script src="script.js"></script>


         </div>
    </div>

    
</body>
</html>
