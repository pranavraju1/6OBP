<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
</head>
<body>
    <h1>Event Registration</h1>
    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>
        
        <label for="event">Event Type:</label>
        <select id="event" name="event" required>
            <option value="">-- Select Event --</option>
            <option value="workshop">Workshop</option>
            <option value="webinar">Webinar</option>
            <option value="conference">Conference</option>
        </select>
        <br><br>
        
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets" min="1" max="5" required>
        <br><br>
        
        <p>Dietary Restrictions:</p>
        <label for="vegetarian">
            <input type="checkbox" id="vegetarian" name="dietary" value="vegetarian">
            Vegetarian
        </label>
        <label for="vegan">
            <input type="checkbox" id="vegan" name="dietary" value="vegan">
            Vegan
        </label>
        <label for="glutenfree">
            <input type="checkbox" id="glutenfree" name="dietary" value="glutenfree">
            Gluten-Free
        </label>
        <label for="none">
            <input type="checkbox" id="none" name="dietary" value="none">
            None
        </label>
        <br><br>
        
        <label for="requests">Special Requests:</label>
        <textarea id="requests" name="requests" rows="4" cols="50"></textarea>
        <br><br>
        
        <label for="terms">
            <input type="checkbox" id="terms" name="terms" required>
            I agree to the terms and conditions
        </label>
        <br><br>
        
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
