<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
        #display { font-size: 48px; margin: 20px; font-weight: bold; color: #333; }
        button { font-size: 20px; padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; }
        #start { background: #4CAF50; color: white; }
        #stop { background: #f44336; color: white; }
        #reset { background: #2196F3; color: white; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1>Simple Stopwatch Timer</h1>
    <div id="display">00:00:00</div>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>

    <script src="script.js"></script>

  </body>
</html>
