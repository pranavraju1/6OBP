<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color: rgba(255, 192, 203, 0.388);
            border-radius: 10px;
            height: 500px;
            width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        #todoInput{
            height: 50px;
            width: 100%;
        }
        .todos{
            width: 100%;
            margin-top: 50px;
            background-color: white;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .todo{
            display: flex;
            /* width: 100%; */
            justify-content:space-between;
            border: 2px solid black;
            padding: 10px;
            margin-bottom: 10px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <input type="text" name="" id="todoInput">
            <button id="addBtn">Add</button>

            <div class="todos">
                <!-- <div class="todo">
                    <div>asdasd</div>
                    <button>edit</button>
                    <button>delete</button>
                </div> -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
